name: PR Build

on:
  pull_request:
    branches: [master]

permissions:
  contents: read
  actions: read

jobs:
  i18n:
    name: i18n consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate translation key parity
        run: ./scripts/i18n-check.sh

  csharp-tests:
    name: C# scenario tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0'

      - name: Run GpuModeController scenarios
        run: dotnet run -c Debug --project tests/GHelper.Linux.Tests

  nix-build:
    name: NixOS package build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      # Full build: catches stale deps.json, SDK fallback-package collisions
      # and fetchNupkg patchelf breakage that a plain dotnet restore misses.
      - name: Build ghelper flake package
        run: nix build ./nixos#ghelper

  bash-tests:
    name: Boot script scenario tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run ghelper-gpu-boot.sh scenarios
        run: bash install/tests/test-ghelper-gpu-boot.sh

      - name: Run gpu-block-helper.sh scenarios
        run: bash install/tests/test-gpu-block-helper.sh

      - name: Run gpu-helper argument checks
        run: bash install/tests/test-gpu-helper.sh

  bpf-vm:
    name: eBPF filter on a real kernel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install qemu, clang and libbpf
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 busybox-static libbpf1 clang zstd cpio xxd

      # KVM when the runner exposes it; the script falls back to TCG.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true

      - name: Load and exercise the filter in a VM
        run: bash install/tests/test-bpf-vm.sh

  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stamp version in .csproj and udev rules
        run: |
          SHORT_SHA=$(echo "${{ github.event.pull_request.head.sha }}" | cut -c1-7)
          VERSION="0.0.0-pr.${{ github.event.pull_request.number }}.${SHORT_SHA}"
          sed -i "s|<Version>.*</Version>|<Version>${VERSION}</Version>|" src/GHelper.Linux.csproj
          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/" install/90-ghelper.rules
          echo "Set version to: ${VERSION}"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0'

      - name: Install Native AOT dependencies
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev libwayland-dev libpipewire-0.3-dev pkg-config

      - name: Build
        run: ./build.sh

      - name: Verify embedded resources
        run: ./scripts/verify-embedded.sh

      - name: Upload binary artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ghelper
          path: dist/ghelper
          retention-days: 7

      - name: Save PR metadata
        run: |
          echo "${{ github.event.pull_request.number }}" > pr-meta.txt
          echo "${{ github.event.pull_request.head.sha }}" >> pr-meta.txt

      - name: Upload PR metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-meta
          path: pr-meta.txt
          retention-days: 7

  appimage:
    needs: [build, csharp-tests, bash-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download binary artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ghelper
          path: dist

      - name: Install libfuse2
        run: sudo apt-get update && sudo apt-get install -y libfuse2

      - name: Build AppImage
        run: ./build-appimage.sh

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage
          path: GHelper-x86_64.AppImage
          retention-days: 7
