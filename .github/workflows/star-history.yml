name: Star History

on:
  schedule:
    - cron: '0 0 * * 0'  # weekly, Sunday midnight UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: star-history
  cancel-in-progress: true

jobs:
  # Listing stargazers needs a token with contents: write
  update:
    if: github.repository == 'utajum/g-helper-linux'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Render charts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/star-history.py "$GITHUB_REPOSITORY" assets/star-history
      - name: Commit charts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/star-history
          if git diff --cached --quiet; then
            echo "No chart changes."
            exit 0
          fi
          git commit -m "chore: update star history [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
